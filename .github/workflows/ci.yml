name: quality-gates

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:build-tools
      - run: npm run check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Recover owned build workspaces
        if: ${{ always() }}
        run: npm run build:clean
      - name: Upload bounded build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: .build-artifacts/logs/*/raw.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  browser-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Recover owned browser-build workspaces
        if: ${{ always() }}
        run: npm run build:clean
      - name: Upload bounded browser-build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.project }}
          path: .build-artifacts/logs/*/raw.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
